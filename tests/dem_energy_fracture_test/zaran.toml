version = "V4.1.0"

[task]
simulation = "SOLVE_FIELD"
solver = "DEM"

[output]
result_folder = "result"

[init]
backup_folder = "backup"

[dem]
time_step = 1e-4
end_time = 0.1
max_iter = 1000
output_iter = 1000
contact_model = "LinearSpringDashpot"
particle_file = "particles.csv"
bond_file = "bonds.csv"
density = 1.0
young_modulus = 100.0
poisson_ratio = 0.2
friction_coeff = 0.0
restitution_coeff = 1.0
surface_energy = 1.0
grain_boundary_energy = 0.0
lattice_thickness = 1.0
reaction_enabled = false
gravity_x = 0.0
gravity_y = 0.0
gravity_z = 0.0

[dem.box]
x_min = -5.0
x_max = 5.0
y_min = -1.0
y_max = 1.0
z_min = -1.0
z_max = 1.0
