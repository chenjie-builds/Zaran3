version = "V4.1.0"

[task]
simulation = "SOLVE_FIELD"
solver = "DEM"

[output]
result_folder = "result"

[init]
backup_folder = "backup"

[dem]
time_step = 2e-7
end_time = 0.002
max_iter = 10000
output_iter = 2500
contact_model = "LinearSpringDashpot"
particle_file = "particles.csv"
bond_file = "bonds.csv"
young_modulus = 1e7
poisson_ratio = 0.30
friction_coeff = 0.0
restitution_coeff = 0.8
density = 2500.0
gravity_x = 0.0
gravity_y = 0.0
gravity_z = 0.0
reaction_enabled = false

[dem.box]
x_min = -0.10
x_max = 0.10
y_min = -0.10
y_max = 0.10
z_min = -0.01
z_max = 0.01
