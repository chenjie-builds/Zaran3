version = "V4.1.0"

[task]
simulation = "SOLVE_FIELD"
solver = "DEM"

[output]
result_folder = "result"

[init]
backup_folder = "backup"

[dem]
time_step = 1e-4
end_time = 0.02
max_iter = 200
output_iter = 200
contact_model = "LinearSpringDashpot"
particle_file = "particles.csv"
bond_file = "bonds.csv"
young_modulus = 1e7
poisson_ratio = 0.3
friction_coeff = 0.0
restitution_coeff = 1.0
density = 2500.0
gravity_x = 0.0
gravity_y = 0.0
gravity_z = 0.0

[dem.box]
x_min = -1.0
x_max = 1.0
y_min = -1.0
y_max = 1.0
z_min = -1.0
z_max = 1.0
