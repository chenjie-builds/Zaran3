version = "V4.1.0"

[task]
simulation = "SOLVE_FIELD"
solver = "DEM"

[output]
result_folder = "result"

[init]
backup_folder = "backup"

[dem]
time_step = 0.01
end_time = 1.0
max_iter = 100
output_iter = 100
contact_model = "LinearSpringDashpot"
particle_file = "particles.csv"
density = 1.0
young_modulus = 100.0
poisson_ratio = 0.2
friction_coeff = 0.0
restitution_coeff = 1.0
reaction_enabled = true
voronoi_enabled = true
voronoi_update_interval = 1
voronoi_max_volume_ratio = 10.0
lattice_thickness = 1.0
gravity_x = 0.0
gravity_y = 0.0
gravity_z = 0.0

[dem.box]
x_min = 0.0
x_max = 3.0
y_min = 0.0
y_max = 3.0
z_min = -1.0
z_max = 1.0
