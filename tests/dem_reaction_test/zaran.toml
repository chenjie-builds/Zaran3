version = "V4.1.0"

[task]
simulation = "SOLVE_FIELD"
solver = "DEM"

[output]
result_folder = "result"

[init]
backup_folder = "backup"

[dem]
time_step = 1e-3
end_time = 0.01
max_iter = 10
output_iter = 10
contact_model = "LinearSpringDashpot"
particle_file = "particles.csv"
bond_file = "bonds.csv"
reaction_enabled = true
ignition_temperature = 500.0
mixed_phase_threshold = 1e-3
burnout_threshold = 0.99
max_temperature = 5000.0
young_modulus = 1e7
poisson_ratio = 0.3
friction_coeff = 0.0
restitution_coeff = 1.0
density = 2500.0
gravity_x = 0.0
gravity_y = 0.0
gravity_z = 0.0

[dem.box]
x_min = -1.0
x_max = 1.0
y_min = -1.0
y_max = 1.0
z_min = -1.0
z_max = 1.0
